name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: agency_test_db
          POSTGRES_USER: agency_test_user
          POSTGRES_PASSWORD: agency_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agency_test_user -d agency_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "False"
      SECRET_KEY: ci-only-secret-key-with-more-than-thirty-two-characters
      API_DOCS_ENABLED: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: agency_test_db
      DB_USER: agency_test_user
      DB_PASSWORD: agency_test_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gettext
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Check code formatting with Black
        run: black --check .

      - name: Check import ordering with isort
        run: isort --check-only .

      - name: Run Ruff lint
        run: ruff check .

      - name: Compile translations
        run: python manage.py compilemessages

      - name: Validate translation catalogs
        run: msgfmt --check locale/fa/LC_MESSAGES/django.po

      - name: Run Django system checks
        run: python manage.py check

      - name: Verify committed migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --file schema.yml --validate

      - name: Run tests
        run: python manage.py test --verbosity 1 --noinput

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag ctrlops-backend:ci .

      - name: Check image metadata
        run: docker image inspect ctrlops-backend:ci
