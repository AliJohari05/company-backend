services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-.env.staging}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  web:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-.env.staging}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - staging_static_data:/app/staticfiles
      - staging_media_data:/app/media
      - staging_private_media_data:/app/private_media
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-.env.staging}
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  migrate:
    build:
      context: .
    restart: "no"
    env_file:
      - ${STAGING_ENV_FILE:-.env.staging}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        python manage.py migrate --noinput && python manage.py compilemessages &&
        python manage.py collectstatic --noinput
    volumes:
      - staging_static_data:/app/staticfiles
      - staging_media_data:/app/media
      - staging_private_media_data:/app/private_media
    networks:
      - backend

  worker:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-.env.staging}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        celery -A config worker --loglevel=INFO
        --concurrency="$${CELERY_WORKER_CONCURRENCY:-2}"
    networks:
      - backend

  beat:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-.env.staging}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: celery -A config beat --loglevel=INFO --schedule=/var/run/celery/celerybeat-schedule
    volumes:
      - staging_celery_beat_data:/var/run/celery
    networks:
      - backend

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-.env.staging}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - staging_static_data:/srv/static:ro
      - staging_media_data:/srv/media:ro
      - staging_caddy_data:/data
      - staging_caddy_config:/config
    networks:
      - backend

volumes:
  staging_postgres_data:
  staging_static_data:
  staging_media_data:
  staging_private_media_data:
  staging_redis_data:
  staging_celery_beat_data:
  staging_caddy_data:
  staging_caddy_config:

networks:
  backend:
    driver: bridge
