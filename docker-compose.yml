
services:
  db:
    image: postgres:15-alpine
    container_name: agency_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: agency_django_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-development-only-redis-password}
    depends_on:
      - db
      - redis

  redis:
    image: redis:7.4-alpine
    container_name: agency_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-development-only-redis-password}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data

  worker:
    build: .
    container_name: agency_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-development-only-redis-password}
    command: celery -A config worker --loglevel=INFO --concurrency=2
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  beat:
    build: .
    container_name: agency_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-development-only-redis-password}
    command: celery -A config beat --loglevel=INFO --schedule=/var/run/celery/celerybeat-schedule
    volumes:
      - .:/app
      - celery_beat_data:/var/run/celery
    depends_on:
      - db
      - redis

  locust:
    profiles: ["loadtest"]
    build:
      context: .
      dockerfile: Dockerfile.locust
    container_name: agency_locust
    command: >-
      locust -f /app/loadtests/locustfile.py
      --host http://web:8000
      --web-host 0.0.0.0
      --web-port 8089
    ports:
      - "8089:8089"
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  celery_beat_data:
