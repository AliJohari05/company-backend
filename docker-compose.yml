
services:
  db:
    image: postgres:15-alpine
    container_name: agency_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: agency_django_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  locust:
    profiles: ["loadtest"]
    build:
      context: .
      dockerfile: Dockerfile.locust
    container_name: agency_locust
    command: >-
      locust -f /app/loadtests/locustfile.py
      --host http://web:8000
      --web-host 0.0.0.0
      --web-port 8089
    ports:
      - "8089:8089"
    depends_on:
      - web

volumes:
  postgres_data:
