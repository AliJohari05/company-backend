[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | media
  | private_media
  | staticfiles
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["apps", "config"]
skip_glob = ["*/migrations/*.py"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "venv",
    "media",
    "private_media",
    "staticfiles",
    "*/migrations/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
